<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Bangkok Flood Watch 3D</title>
<!-- Link preview card (LINE / Facebook / X). og:image must be an absolute URL. -->
<meta name="description" content="แผนที่น้ำท่วมกรุงเทพฯ แบบสด: น้ำท่วมถนนจากเซนเซอร์ กทม. ระดับน้ำคลองเทียบตลิ่ง ฝน รายงาน Traffy ทางหลวงน้ำท่วม และสายด่วน">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Bangkok Flood Watch 3D">
<meta property="og:url" content="https://bangkokflood.netlify.app/">
<meta property="og:title" content="แผนที่น้ำท่วมกรุงเทพฯ แบบสด · Bangkok Flood Watch 3D">
<meta property="og:description" content="น้ำท่วมถนนจากเซนเซอร์ กทม. · ระดับน้ำคลองเทียบตลิ่ง · ฝน · ดูรอบบ้าน · สายด่วน · ต่างจังหวัด">
<meta property="og:image" content="https://bangkokflood.netlify.app/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="แผนที่น้ำท่วมกรุงเทพฯ แสดงจุดน้ำท่วมถนนและสีรายเขต">
<meta property="og:locale" content="th_TH">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>
<div id="map"></div>

<div class="top">
  <div class="stats">
    <div class="panel badge"><div class="lbl" data-i="riskTitle"></div><div class="val" id="riskValue">--</div><div class="sub" id="riskLabel"></div></div>
    <div class="panel badge"><div class="lbl" id="waterTitle"></div><div class="val" id="waterValue">--</div><div class="sub" id="waterSub"></div></div>
    <div class="panel badge"><div class="lbl" data-i="floodedTitle"></div><div class="val" id="floodCount">--</div><div class="sub" id="floodedSub"></div></div>
    <div class="panel badge"><div class="lbl" data-i="rainTitle"></div><div class="val" id="rainValue">--</div><div class="sub" id="rainSub"></div></div>
  </div>
  <div class="tools">
    <input class="panel search" id="search" list="districtList" autocomplete="off" data-ph="search">
    <datalist id="districtList"></datalist>
    <div class="panel lang"><button id="langTH" class="active">TH</button><button id="langEN">EN</button></div>
  </div>
  <div class="panel timebar">
    <label for="histAt" data-i="histLbl"></label>
    <input type="datetime-local" id="histAt" step="600" autocomplete="off">
    <button id="histLive" class="btn small live-on" data-i="liveBtn"></button>
  </div>
  <div class="panel banner hist" id="histBanner" hidden></div>
  <div class="panel banner" id="histError" hidden data-i="histFail"></div>
  <div class="panel banner" id="simBanner" hidden data-i="simBanner"></div>
  <div class="panel banner" id="mockBanner" hidden></div>
</div>

<aside class="panel sidebar" id="sidebar">
  <div class="side-head">
    <b id="sideTitle"></b>
    <button id="refresh" class="btn small" data-i="refresh"></button>
  </div>
  <p class="summary clamp" id="summary"></p>
  <button class="more-link" id="summaryMore" hidden></button>
  <div class="quick-row">
    <button class="btn small" id="hotlineBtn" data-i="hotlineBtn"></button>
    <button class="btn small" id="rainBtn" data-i="rainBtn"></button>
    <button class="btn small" id="linksBtn" data-i="linksBtn"></button>
    <button class="btn small" id="nearBtn" data-i="nearBtn"></button>
    <label class="btn small nation" id="nationLbl"><input type="checkbox" id="lyNation" autocomplete="off"> <span data-i="nationBtn"></span></label>
  </div>
  <div class="traffic-row">
    <span id="trafficIdx" class="tidx" hidden></span>
    <a id="trafficBtn" class="btn small" href="https://www.google.com/maps/@13.7563,100.5018,12z/data=!5m1!1e1" target="_blank" rel="noopener" data-i="traffic"></a>
  </div>
  <div id="sideBody"></div>
</aside>
<button class="panel side-toggle" id="sideToggle" aria-label="list">☰</button>

<div class="bottom">
  <div class="panel sim">
    <label class="row"><input type="checkbox" id="simMode" autocomplete="off"> <span data-i="simMode"></span></label>
    <div id="simControls" hidden>
      <button class="btn" id="playBtn"></button>
      <div class="row"><span>0</span><input type="range" id="waterSlider" min="0" max="180" value="60" autocomplete="off"><span>180 cm</span></div>
    </div>
    <div class="legend">
      <span><i class="dot" style="background:var(--l0)"></i><span data-i="l0"></span></span>
      <span><i class="dot" style="background:var(--l1)"></i><span data-i="l1"></span></span>
      <span><i class="dot" style="background:var(--l2)"></i><span data-i="l2"></span></span>
      <span><i class="dot" style="background:var(--l3)"></i><span data-i="l3"></span></span>
      <span><i class="dot" style="background:var(--l-none);border:1px solid #56627a"></i><span data-i="l4"></span></span>
    </div>
  </div>
  <details class="panel layers">
    <summary></summary>
    <label><input type="checkbox" autocomplete="off" id="lyRoad"> <i class="sw" style="background:#f2495c;border:1.5px solid #fff"></i> <span data-i="lyRoad"></span></label>
    <label><input type="checkbox" autocomplete="off" id="lyCanal"> <i class="sw" style="border:3px solid #f5924b;background:#0b1322"></i> <span data-i="lyCanal"></span></label>
    <label><input type="checkbox" autocomplete="off" id="lyRain"> <i class="sw" style="background:#4292c6"></i> <span data-i="lyRain"></span></label>
    <label><input type="checkbox" autocomplete="off" id="lyReports"> <i class="sw" style="background:#c084fc;border:1px solid #fff"></i> <span data-i="lyReports"></span></label>
    <label><input type="checkbox" autocomplete="off" id="lyEvents"> <i class="sw" style="background:#f5924b;border:1.5px solid #fff;border-radius:2px;transform:rotate(45deg) scale(.85)"></i> <span data-i="lyEvents"></span></label>
    <label><input type="checkbox" autocomplete="off" id="lyDoh"> <i class="sw" style="background:#f2495c;border:2px solid #fff;border-radius:50%"></i> <span data-i="lyDoh"></span></label>
    <label><input type="checkbox" autocomplete="off" id="lyDwr"> <i class="sw" style="background:#0b1322;border:2px solid #2dd4bf;border-radius:3px"></i> <span data-i="lyDwr"></span></label>
    <label><input type="checkbox" autocomplete="off" id="lyCams"> <i class="sw" style="background:#0b1322;border:2px solid #e8ecf4;border-radius:3px"></i> <span data-i="lyCams"></span></label>
    <label><input type="checkbox" autocomplete="off" id="lyDistrict" checked> <span data-i="lyDistrict"></span></label>
    <label><input type="checkbox" autocomplete="off" id="lyBuild"> <span data-i="lyBuild"></span></label>
    <label><input type="checkbox" autocomplete="off" id="lySat"> <span data-i="lySat"></span></label>
    <label><input type="checkbox" autocomplete="off" id="lyTerrain"> <span data-i="lyTerrain"></span></label>
    <p class="note" id="terrainNote" hidden data-i="terrainNote"></p>
    <div class="sources" id="sources"></div>
  </details>
</div>

<dialog id="hotlineDlg" class="panel dlg">
  <div class="dlg-head"><b data-i="hotlineTitle"></b><button class="btn small" data-close aria-label="close">✕</button></div>
  <ul class="hotlines" id="hotlineList"></ul>
  <p class="note"><span data-i="hotlineNote"></span> · <a href="https://line.me/R/ti/p/@1784ddpm" target="_blank" rel="noopener" data-i="lineDdpm"></a></p>
  <div class="care"><b data-i="careTitle"></b><p data-i="careText"></p><button class="btn small" id="shareSite" data-i="shareSite"></button></div>
</dialog>
<dialog id="linksDlg" class="panel dlg">
  <div class="dlg-head"><b data-i="linksTitle"></b><button class="btn small" data-close aria-label="close">✕</button></div>
  <ul class="links" id="linksList"></ul>
</dialog>
<dialog id="nearDlg" class="panel dlg">
  <div class="dlg-head"><b data-i="nearTitle"></b><button class="btn small" data-close aria-label="close">✕</button></div>
  <button class="btn" id="nearGps" data-i="nearGps" style="width:100%"></button>
  <form id="nearForm" class="near-form"><input id="nearInput" type="text" inputmode="url" autocomplete="off"><button class="btn" data-i="nearGo"></button></form>
  <p class="note" id="nearMsg"></p>
  <p class="note" data-i="nearNote"></p>
</dialog>
<dialog id="rainDlg" class="panel dlg dlg-wide">
  <div class="dlg-head">
    <b data-i="rainTitle2"></b>
    <span class="dlg-tabs"><button class="btn small" data-overlay="rain" data-i="rainTabFc"></button><button class="btn small" data-overlay="radar" data-i="rainTabRadar"></button><button class="btn small" data-overlay="rainAccu" data-i="rainTabAccu"></button></span>
    <button class="btn small" data-close aria-label="close">✕</button>
  </div>
  <iframe id="windyFrame" title="Windy" referrerpolicy="no-referrer"></iframe>
  <p class="note"><span data-i="rainNote"></span> <a href="https://www.windy.com/?rain,13.75,100.55,9" target="_blank" rel="noopener">Windy.com ↗</a></p>
</dialog>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
