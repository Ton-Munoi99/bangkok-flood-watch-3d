<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เฝ้าระวังน้ำท่วมกรุงเทพฯ 3D — แผนที่ 50 เขตจริง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#070B16;--panel:rgba(14,21,38,.88);--panel-border:rgba(56,189,248,.22);--text:#E8ECF4;--text-muted:#8996B0;--accent:#38BDF8;--accent-dim:#1E6E8C;--risk-safe:#3ED598;--risk-watch:#F5C748;--risk-high:#F5924B;--risk-severe:#F2495C;--font-ui:'IBM Plex Sans Thai',system-ui,sans-serif;--font-mono:'IBM Plex Mono',ui-monospace,monospace;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#070B16;}}
:root[data-theme="dark"]{--bg:#070B16;}
*{box-sizing:border-box;}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font-ui);}
#scene{position:fixed;inset:0;}
#scene canvas{display:block;touch-action:none;}
.hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;}
.hud>*{pointer-events:auto;}
.topbar{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;padding:calc(14px + env(safe-area-inset-top,0px)) 14px 0 14px;}
.panel{background:var(--panel);border:1px solid var(--panel-border);border-radius:10px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 24px rgba(0,0,0,.35);}
.badge{padding:10px 14px;min-width:150px;}
.badge-label{font-size:11.5px;color:var(--text-muted);}
.badge-value{font-family:var(--font-mono);font-size:26px;font-weight:600;line-height:1.15;margin-top:2px;}
.badge-sub{font-size:12px;margin-top:2px;color:var(--text-muted);}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;}
.search-wrap{position:relative;flex:1;min-width:180px;max-width:340px;}
.search-input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--panel-border);background:var(--panel);color:var(--text);font-family:var(--font-ui);font-size:14px;outline:none;}
.search-input:focus-visible{border-color:var(--accent);}
.search-input::placeholder{color:var(--text-muted);}
.search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;max-height:240px;overflow:auto;z-index:20;}
.search-item{padding:9px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.05);}
.search-item:hover{background:rgba(56,189,248,.1);}
.lang-toggle{display:flex;gap:4px;padding:6px;}
.lang-toggle button{border:none;background:transparent;color:var(--text-muted);font-family:var(--font-mono);font-size:12px;padding:5px 9px;border-radius:6px;cursor:pointer;}
.lang-toggle button.active{background:var(--accent-dim);color:#fff;}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.body-row{flex:1;display:flex;min-height:0;}
.spacer{flex:1;}
.sidebar{width:290px;margin:12px 14px 12px 0;padding:12px;display:flex;flex-direction:column;min-height:0;transition:transform .25s ease;}
.sidebar h3{margin:2px 4px 10px;font-size:13px;color:var(--text-muted);font-weight:600;}
.event-list{overflow-y:auto;display:flex;flex-direction:column;gap:8px;}
.event-item{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:9px 10px;cursor:pointer;}
.event-item:hover{border-color:var(--accent-dim);}
.event-top{display:flex;justify-content:space-between;align-items:center;gap:6px;}
.event-name{font-size:13.5px;font-weight:500;}
.event-tag{font-size:10.5px;font-family:var(--font-mono);padding:2px 7px;border-radius:20px;white-space:nowrap;}
.event-time{font-size:11px;color:var(--text-muted);margin-top:3px;}
.bottom-panel{margin:0 14px calc(14px + env(safe-area-inset-bottom,0px));padding:12px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.slider-block{flex:1;min-width:220px;}
.slider-row{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-muted);}
.slider-row input[type=range]{flex:1;accent-color:var(--accent);}
.play-btn{border:1px solid var(--panel-border);background:rgba(56,189,248,.1);color:var(--text);border-radius:8px;padding:9px 14px;font-family:var(--font-ui);font-size:13px;cursor:pointer;}
.play-btn:hover{background:rgba(56,189,248,.2);}
.legend{display:flex;gap:10px;font-size:11.5px;color:var(--text-muted);flex-wrap:wrap;margin-top:4px;}
.legend span{display:flex;align-items:center;}
.layers{display:flex;gap:12px;font-size:12px;color:var(--text-muted);flex-wrap:wrap;}
.layers label{display:flex;align-items:center;gap:5px;cursor:pointer;}
.layers input{accent-color:var(--accent);}
.sidebar-toggle{position:fixed;bottom:calc(120px + env(safe-area-inset-bottom,0px));right:16px;width:44px;height:44px;border-radius:50%;display:none;align-items:center;justify-content:center;font-size:18px;cursor:pointer;z-index:30;border:1px solid var(--panel-border);background:var(--panel);color:var(--text);}
.popup{position:fixed;z-index:40;padding:10px 12px;min-width:200px;font-size:12.5px;display:none;}
.popup b{font-size:14px;}
.popup .row{display:flex;justify-content:space-between;gap:12px;margin-top:4px;color:var(--text-muted);}
.popup .row span:last-child{color:var(--text);font-family:var(--font-mono);}
.source{position:fixed;left:14px;top:calc(120px + env(safe-area-inset-top,0px));font-size:10.5px;color:var(--text-muted);max-width:250px;line-height:1.55;padding:8px 10px;}
@media (max-width:820px){
 .sidebar{position:fixed;top:0;bottom:0;right:0;margin:0;width:80vw;max-width:320px;border-radius:0;transform:translateX(100%);z-index:25;padding-top:calc(14px + env(safe-area-inset-top,0px));}
 .sidebar.open{transform:translateX(0);}
 .sidebar-toggle{display:flex;}
 .body-row{pointer-events:none;}
 .body-row .sidebar{pointer-events:auto;}
 .source{display:none;}
 .badge-value{font-size:22px;}
}
::-webkit-scrollbar{width:6px;}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:10px;}
</style>
</head>
<body>
<div id="scene"></div>
<div class="hud">
 <div class="topbar">
  <div class="panel badge">
   <div class="badge-label" data-i="riskTitle">ดัชนีความเสี่ยงน้ำท่วมรวม</div>
   <div class="badge-value" id="riskValue">--</div>
   <div class="badge-sub"><span class="dot" id="riskDot"></span><span id="riskLabel"></span></div>
  </div>
  <div class="panel badge">
   <div class="badge-label" data-i="waterTitle">ระดับน้ำจำลอง</div>
   <div class="badge-value" id="waterValue">--</div>
   <div class="badge-sub" id="floodCount"></div>
  </div>
  <div class="search-wrap">
   <input class="search-input" id="searchInput" type="text" placeholder="ค้นหาเขต เช่น ลาดกระบัง, สาทร..." aria-label="ค้นหาเขต">
   <div class="panel search-results" id="searchResults" style="display:none;"></div>
  </div>
  <div class="panel lang-toggle"><button class="active" id="langTH">TH</button><button id="langEN">EN</button></div>
 </div>
 <div class="body-row">
  <div class="spacer"></div>
  <div class="panel sidebar" id="sidebar"><h3 data-i="events">จุดเฝ้าระวังน้ำท่วม</h3><div class="event-list" id="eventList"></div></div>
 </div>
 <div class="panel bottom-panel">
  <button class="play-btn" id="playBtn">▶ จำลองฝนตก</button>
  <div class="slider-block">
   <div class="slider-row"><span>0</span><input type="range" id="waterSlider" min="0" max="180" value="60" aria-label="ระดับน้ำ"><span>180 cm</span></div>
   <div class="legend">
    <span><i class="dot" style="background:var(--risk-safe)"></i><b data-i="safe" style="font-weight:400">ปลอดภัย</b></span>
    <span><i class="dot" style="background:var(--risk-watch)"></i><b data-i="watch" style="font-weight:400">เฝ้าระวัง</b></span>
    <span><i class="dot" style="background:var(--risk-high)"></i><b data-i="high" style="font-weight:400">เสี่ยงสูง</b></span>
    <span><i class="dot" style="background:var(--risk-severe)"></i><b data-i="severe" style="font-weight:400">น้ำท่วม</b></span>
   </div>
  </div>
  <div class="layers">
   <label><input type="checkbox" id="lyLabels" checked><span data-i="lLabels">ชื่อเขต</span></label>
   <label><input type="checkbox" id="lyRoads" checked><span data-i="lRoads">ถนนสายหลัก</span></label>
   <label><input type="checkbox" id="lyBuild" checked><span data-i="lBuild">อาคาร</span></label>
  </div>
 </div>
</div>
<button class="sidebar-toggle" id="sidebarToggle" aria-label="รายการ">☰</button>
<div class="panel popup" id="popup"></div>
<div class="panel source" data-i="src">ขอบเขต 50 เขต: OpenGISData-Thailand (chingchai, GitHub) · แม่น้ำ/ถนน: Natural Earth 1:10m · ความสูงพื้นที่และอาคาร: ข้อมูลจำลองเพื่อสาธิต ไม่ใช่ DEM จริง</div>

 popup.style.display='block';
 var x=pos?Math.min(pos.x+14,innerWidth-230):innerWidth/2-110,y=pos?Math.min(pos.y+14,innerHeight-190):110;
 popup.style.left=Math.max(8,x)+'px';popup.style.top=y+'px';
 clearTimeout(pt);pt=setTimeout(function(){popup.style.display='none';},5000);
}

/* picking & hover */
var ray=new THREE.Raycaster(),mouse=new THREE.Vector2(),hovered=null,down=null;
function pick(e){mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,camera);var h=ray.intersectObjects(pickMeshes);return h.length?h[0].object.userData.d:null;}
renderer.domElement.addEventListener('pointerdown',function(e){down={x:e.clientX,y:e.clientY};});
renderer.domElement.addEventListener('pointerup',function(e){if(!down)return;if(Math.hypot(e.clientX-down.x,e.clientY-down.y)<6){var d=pick(e);if(d)showPopup(d,{x:e.clientX,y:e.clientY});}down=null;});
renderer.domElement.addEventListener('pointermove',function(e){if(e.pointerType!=='mouse')return;var d=pick(e);
 if(hovered&&hovered!==d)hovered.mat.emissive.setHex(0x000000);
 if(d){d.mat.emissive.setHex(0x1a2a44);renderer.domElement.style.cursor='pointer';}else renderer.domElement.style.cursor='';
 hovered=d;});

/* search */
var si=document.getElementById('searchInput'),sr=document.getElementById('searchResults');
si.addEventListener('input',function(){var q=si.value.trim().toLowerCase();sr.innerHTML='';
 if(!q){sr.style.display='none';return;}
 var ms=districts.filter(function(d){return d.th.indexOf(q)>-1||d.en.toLowerCase().indexOf(q)>-1;});
 if(!ms.length){sr.innerHTML='<div class="search-item" style="cursor:default;color:var(--text-muted)">'+(LANG==='th'?'ไม่พบเขตนี้ ลองพิมพ์ชื่ออื่น':'No district found. Try another name.')+'</div>';sr.style.display='block';return;}
 ms.slice(0,8).forEach(function(d){var it=document.createElement('div');it.className='search-item';it.textContent=LANG==='th'?d.th:d.en;
  it.onclick=function(){flyTo(d);showPopup(d,null);si.value='';sr.style.display='none';};sr.appendChild(it);});
 sr.style.display='block';});
document.addEventListener('pointerdown',function(e){if(!sr.contains(e.target)&&e.target!==si)sr.style.display='none';});

/* controls */
var slider=document.getElementById('waterSlider');
slider.addEventListener('input',function(){stop();update(+slider.value);});
var timer=null,pb=document.getElementById('playBtn');
function stop(){if(timer){clearInterval(timer);timer=null;pb.textContent=T[LANG].play;}}
pb.onclick=function(){if(timer){stop();return;}if(waterCm>=180)update(0);pb.textContent=T[LANG].pause;
 timer=setInterval(function(){var v=waterCm+0.8;if(v>=180){v=180;update(v);stop();return;}update(v);},120);};
document.getElementById('lyLabels').onchange=function(e){labelGroup.visible=e.target.checked;};
document.getElementById('lyRoads').onchange=function(e){roadGroup.visible=e.target.checked;};
document.getElementById('lyBuild').onchange=function(e){buildingGroup.visible=e.target.checked;};
document.getElementById('sidebarToggle').onclick=function(){document.getElementById('sidebar').classList.toggle('open');};
function setLang(l){LANG=l;document.getElementById('langTH').classList.toggle('active',l==='th');document.getElementById('langEN').classList.toggle('active',l==='en');
 document.documentElement.lang=l;
 document.querySelectorAll('[data-i]').forEach(function(n){n.textContent=T[l][n.getAttribute('data-i')];});
 si.placeholder=T[l].search;pb.textContent=timer?T[l].pause:T[l].play;buildLabels();update(waterCm);}
document.getElementById('langTH').onclick=function(){setLang('th');};
document.getElementById('langEN').onclick=function(){setLang('en');};

addEventListener('resize',function(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function loop(){requestAnimationFrame(loop);
 if(flight){var t=Math.min((performance.now()-flight.t0)/flight.dur,1),e=reduce?1:1-Math.pow(1-t,3);
  camera.position.lerpVectors(flight.fp,flight.tp,e);controls.target.lerpVectors(flight.ft,flight.tt,e);if(t>=1)flight=null;}
 var now=performance.now();
 markers.forEach(function(m,i){m.position.y=m.userData.base||(m.userData.base=m.position.y);if(!reduce)m.position.y=m.userData.base+Math.sin(now*0.003+i)*0.2;});
 if(labelGroup.visible){labelGroup.children.forEach(function(s){var dist=camera.position.distanceTo(s.position);s.visible=s.userData.area>=18||dist<45;var f=Math.min(1,Math.max(0.28,dist/70));s.scale.set(s.userData.bw*f,s.userData.bh*f,1);});}
 controls.update();renderer.render(scene,camera);}

update(waterCm);
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(buildLabels);
loop();
})();
</script>
</body>
</html>
